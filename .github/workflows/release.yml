name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.0)'
        required: true

# Read by default; only the job that publishes gets write, and only to contents.
permissions:
  contents: read

# One release at a time. Not cancel-in-progress: killing a run midway through
# `gh release create` would leave a partially uploaded release behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Actions are pinned to commit hashes; the trailing comment is the readable version.
jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Tag names and workflow inputs are attacker-controllable, so they arrive through
      # the environment. Interpolating them into the script body would let a crafted tag
      # execute as shell.
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="${INPUT_VERSION:-}"
          [ -n "$version" ] || version="${REF_NAME#v}"
          # MSI ProductVersion rejects anything that is not major.minor.patch. A glob
          # cannot express this: in a case pattern [0-9]* is one digit then anything, so
          # it would happily accept 1.2.3-beta and fail much later inside build-msi.ps1.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be major.minor.patch, got '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

  windows:
    name: Windows packages
    needs: version
    runs-on: windows-latest
    steps:
      # Always build the tag being released, never the branch the run was dispatched
      # from. gh release create --verify-tag requires v$VERSION to already exist, so a
      # manual run would otherwise build whatever master happens to be and publish it
      # under an older tag. A missing tag now fails here, before anything is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI and zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: .\packaging\windows\build-msi.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-latest
    steps:
      # Always build the tag being released, never the branch the run was dispatched
      # from. gh release create --verify-tag requires v$VERSION to already exist, so a
      # manual run would otherwise build whatever master happens to be and publish it
      # under an older tag. A missing tag now fails here, before anything is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build tarballs and debs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          chmod +x packaging/linux/build-packages.sh
          ./packaging/linux/build-packages.sh "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    steps:
      # Always build the tag being released, never the branch the run was dispatched
      # from. gh release create --verify-tag requires v$VERSION to already exist, so a
      # manual run would otherwise build whatever master happens to be and publish it
      # under an older tag. A missing tag now fails here, before anything is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          set -eu
          mkdir -p dist
          # download-artifact nests each artifact in its own directory.
          find artifacts -type f -exec mv -t dist {} +
          cd dist
          sha256sum ./* > SHA256SUMS
          ls -la

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          gh release create "v$VERSION" dist/* \
            --title "JonsboLite v$VERSION" \
            --notes-file .github/release-notes.md \
            --verify-tag
