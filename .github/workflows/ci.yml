name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Actions are pinned to commit hashes, not tags: a tag is mutable, so `@v7` is a promise
# from whoever can move it. The trailing comment is the human-readable version.
jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-windows-

      # Builds net8.0 and net8.0-windows both. The net8.0 pass compiles the Linux
      # implementations, so a change that breaks them fails here rather than at release.
      - name: Build (both target frameworks)
        run: dotnet build -c Release -warnaserror

      - name: Publish
        run: dotnet publish JonsboLite -f net8.0-windows -c Release

      # No panel on a CI runner, so this checks the binary is intact and starts, nothing
      # more. The size floor catches a silently broken single-file publish, which has
      # happened once already and produced an installer containing only the apphost stub.
      - name: Smoke test
        run: |
          $exe = 'JonsboLite\bin\Release\net8.0-windows\win-x64\publish\JonsboLite.exe'
          $size = (Get-Item $exe).Length
          "published $size bytes"
          if ($size -lt 1MB) { throw "single-file publish looks broken: $size bytes (expected >1MB)" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

      # v6+ requires accepting a paid maintenance-fee licence, so this stays on the last
      # MIT-licensed line.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        run: .\packaging\windows\build-msi.ps1 -Version 1.0.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-linux-

      # Only the portable framework here: net8.0-windows needs the Windows Desktop
      # targeting pack, which is the Windows job's business.
      - name: Build (net8.0)
        run: |
          dotnet build JonsboLite.Core -c Release -warnaserror
          dotnet build JonsboLite -f net8.0 -c Release -warnaserror

      - name: Shell script lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck packaging/linux/*.sh

      - name: Build packages
        run: |
          chmod +x packaging/linux/build-packages.sh
          ./packaging/linux/build-packages.sh 1.0.0

      - name: Smoke test
        run: |
          set -eu
          bin=JonsboLite/bin/Release/net8.0/linux-x64/publish/JonsboLite
          size=$(stat -c%s "$bin")
          echo "published $size bytes"
          [ "$size" -gt 1000000 ] || { echo "self-contained publish looks broken: $size bytes"; exit 1; }
          "$bin" --help

      # Proves the sysfs backend runs against a real kernel. The runner has no panel and
      # few sensors, so this asserts it does not crash, not that it finds anything.
      - name: Sensor discovery on a real kernel
        run: |
          set -eu
          bin=JonsboLite/bin/Release/net8.0/linux-x64/publish/JonsboLite
          "$bin" --list-sensors
          "$bin" --show-binding

      - name: Verify .deb
        run: |
          set -eu
          deb=$(ls dist/jonsbolite_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          # Lintian is advisory here; packaging problems should be visible, not fatal.
          sudo apt-get install -y lintian
          lintian "$deb" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  audit:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Static analysis of these workflows themselves: template injection, credential
      # persistence, unpinned actions, over-broad permissions. pipx ships on the runner.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor --persona regular .github/workflows/
