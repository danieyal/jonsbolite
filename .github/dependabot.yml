# Actions are pinned to commit hashes, which is good for supply-chain safety and bad for
# staying current: a pinned hash never moves, so without this the pins quietly rot.
# Dependabot understands hash pins and updates both the hash and the trailing version
# comment together.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "master"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "master"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    # No ignore rule for LibreHardwareMonitorLib's 0.9.7 prerelease stream, even though
    # it was deliberately dropped for stable 0.9.6: Dependabot only offers a prerelease
    # when the current version is itself a prerelease, and 0.9.6 is not. An earlier
    # attempt to pin it out used versions: ["0.9.7-pre*"], which is a glob rather than a
    # version requirement — Dependabot rejected the whole nuget config with
    # illformed_requirement, so no NuGet updates ran at all.
